workflows:
  android-capacitor:
    name: MultiJeuxGo Android
    max_build_duration: 30
    environment:
      groups:
        - supabase_env
      node: 22
      java: 17
    scripts:
      - name: Installer les dependances et compiler Vue
        script: |
          npm install
          npm run build
          npx cap sync android
      - name: Compiler l'APK et le Bundle AAB Android
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab